name: Supabase Backup

on:
  workflow_dispatch:
  schedule:
    # Runs hourly, offset from the top of the hour to reduce GitHub Actions delays.
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is required."
            exit 1
          fi

          if [ -z "$BACKUP_ENCRYPTION_PASSPHRASE" ]; then
            echo "BACKUP_ENCRYPTION_PASSPHRASE secret is required."
            exit 1
          fi

          if [ -z "$BACKUP_S3_BUCKET" ]; then
            echo "BACKUP_S3_BUCKET secret is required."
            exit 1
          fi

          if [ -z "$BACKUP_S3_ENDPOINT_URL" ]; then
            echo "BACKUP_S3_ENDPOINT_URL secret is required."
            exit 1
          fi

          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "BACKUP_S3_ACCESS_KEY_ID secret is required."
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "BACKUP_S3_SECRET_ACCESS_KEY secret is required."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077

          backup_dir="supabase-backup-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir "$backup_dir"

          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$backup_dir/roles.sql" --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$backup_dir/schema.sql"
          supabase db dump --db-url "$SUPABASE_DB_URL" --file "$backup_dir/data.sql" --data-only --use-copy

          tar -czf "$backup_dir.tar.gz" "$backup_dir"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg --batch --yes \
            --symmetric \
            --pinentry-mode loopback \
            --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "$backup_dir.tar.gz.gpg" \
            "$backup_dir.tar.gz"

          rm -rf "$backup_dir" "$backup_dir.tar.gz"

          echo "BACKUP_FILE=$backup_dir.tar.gz.gpg" >> "$GITHUB_ENV"

      - name: Upload encrypted backup to private storage
        shell: bash
        env:
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT_URL }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail

          backup_prefix="${BACKUP_S3_PREFIX:-supabase}"
          backup_prefix="${backup_prefix#/}"
          backup_prefix="${backup_prefix%/}"

          if [ -n "$backup_prefix" ]; then
            backup_key="$backup_prefix/$BACKUP_FILE"
          else
            backup_key="$BACKUP_FILE"
          fi

          aws s3 cp "$BACKUP_FILE" "s3://$BACKUP_S3_BUCKET/$backup_key" \
            --endpoint-url "$BACKUP_S3_ENDPOINT_URL" \
            --region "${BACKUP_S3_REGION:-auto}" \
            --only-show-errors

          rm -f "$BACKUP_FILE"
